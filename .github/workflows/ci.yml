name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: pnpm check

      - name: Verify storage failover with isolated Redis instances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-server python3-redis
          /usr/bin/python3 realtime/deploy/storage-sync-test.py
